# frontend/nginx.conf — production frontend reverse proxy + static server
# -----------------------------------------------------------------------
# Mounted at /etc/nginx/conf.d/default.conf by Dockerfile.prod. Replaces
# nginx's default "welcome page" server block with ours.
#
# Two responsibilities:
#   1. Serve the built React bundle from /usr/share/nginx/html. The
#      `try_files ... /index.html` fallback is the standard SPA hack —
#      any URL that doesn't match a file gets index.html, so React
#      Router can handle /ingest, /answer, etc. without 404s on reload.
#   2. Proxy /api/* and /healthz to the backend service. In docker
#      compose this resolves to the backend container by service name;
#      behind an external SSO proxy in production deployments the
#      external proxy can either preserve this routing or route /api
#      directly to the backend, bypassing this nginx.
#
# SSE: the proxy_pass block disables proxy_buffering and sets
# X-Accel-Buffering: no, mirroring the headers the FastAPI service
# already emits. Without these, nginx would chunk the SSE stream into
# a single response at end-of-stream and the live event-by-event UX
# would disappear.

server {
    listen 3000;
    server_name _;

    # Default: serve the React bundle.
    root /usr/share/nginx/html;
    index index.html;

    # Static asset caching. The Vite build emits hashed filenames for
    # JS/CSS/assets, so they can be cached aggressively — content
    # changes ride on a new filename. index.html stays no-cache so
    # the hashed bundle refs are always fresh.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API + healthz: proxy to backend. The `backend` hostname resolves
    # by compose service name.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE survival: don't buffer, don't add Connection: close.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 1h;   # Long Mistral runs (28+ questions)
                                  # mustn't trip an idle-timeout close.
    }

    location /healthz {
        proxy_pass http://backend:8000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA fallback — any unmatched path serves index.html so React Router
    # owns the client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
